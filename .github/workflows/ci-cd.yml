name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --production

      - name: Syntax check
        run: node --check index.js

      - name: Restart app on port 3002
        run: |
          PORT=3002 pm2 restart app --update-env || PORT=3002 pm2 start index.js --name "app"
          pm2 save

      - name: Health check
        run: |
          sleep 2
          curl -f http://localhost:3002

